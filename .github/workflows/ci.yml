name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_dummy
      SUPPLIER_API_ENCRYPTION_KEY: ci-supplier-key-32-byte-minimum
      OPENAI_API_KEY: sk-ci-dummy
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      CRON_SECRET: ci-cron-secret-dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull request quality gate
        if: github.event_name == 'pull_request'
        run: npm run check:ci

      - name: Branch quality gate
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: npm run check:ci

      - name: Main release gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:release

      - name: Manual full gate
        if: github.event_name == 'workflow_dispatch'
        run: npm run check:all
